[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "my-vulnerable-app"
version = "0.1.0"
description = "A sample application with transitive dependencies"
requires-python = ">=3.9"

dependencies = [
    # Direct dependencies (each pulls in transitive deps)
    "flask==2.0.1",          # → Werkzeug, Jinja2, itsdangerous, click, MarkupSafe
    "requests==2.28.0",      # → urllib3, certifi, charset-normalizer, idna
    "sqlalchemy==1.4.46",    # → greenlet
    "celery==5.2.7",         # → kombu → amqp → vine; billiard; click-didyoumean; click-plugins; click-repl; prompt-toolkit → wcwidth
    "boto3==1.26.0",         # → botocore → jmespath, python-dateutil → six; s3transfer
    "pillow==9.0.0",         # (pure C extension, few Python transitive deps)
    "pydantic==1.10.2",      # → typing-extensions
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2",
    "pytest-cov>=4.0",
]
